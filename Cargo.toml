[package]
name = "bleur"
version = "0.0.6"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://bleur.uz"
repository = "https://github.com/bleur-org/bleur"
description = "That buddy that will get everything ready for you"
authors = ["Sokhibjon Orzikulov <sakhib@orzklv.uz>"]

# Dependencies that will included with final binary
[dependencies]
owo-colors = { version = "4.3.0", default-features = false, features = [
  "supports-colors",
] }
clap = { version = "4.6.0", features = ["derive", "color", "std"] }
reqwest = { version = "0.13.2", features = ["stream", "blocking", "rustls"] }
serde = { version = "1.0.219", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "0.9.8"
url = { version = "2.5.4", default-features = false, features = ["serde"] }
which = "8.0.2"
serde_json = "1.0.141"
git2 = "0.20.4"
tokio-stream = { version = "0.1.17", features = ["full"] }
zip = "8.5.1"
inquire = {version = "0.9.4", features = ["editor"]}
dircpy = "0.3.20"
regex = "1.12.3"

# Development dependencies which aren't used in release binary
[dev-dependencies]

# Optimize release binary as much as possible
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
